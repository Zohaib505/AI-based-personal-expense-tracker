{% extends 'base.html' %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2 text-center">
            <h1 class="display-1">404</h1>
            <h2>Page Not Found</h2>
            <p class="lead">Sorry, the page you are looking for does not exist or has been moved.</p>
            
            <div class="mt-4">
                <a href="{% url 'expenses' %}" class="btn btn-primary btn-lg">Go to Dashboard</a>
                <a href="/" class="btn btn-secondary btn-lg">Go to Home</a>
            </div>
            
            <p class="text-muted mt-4">
                If you believe this is an error, please <a href="mailto:support@expensetracker.com">contact support</a>.
            </p>
        </div>
    </div>
</div>
{% endblock %}
