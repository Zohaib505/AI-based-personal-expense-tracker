{% extends 'base.html' %}

{% block title %}Server Error - 500{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2 text-center">
            <h1 class="display-1">500</h1>
            <h2>Server Error</h2>
            <p class="lead">Sorry, something went wrong on our end. Please try again later.</p>
            
            <div class="mt-4">
                <a href="javascript:history.back()" class="btn btn-primary btn-lg">Go Back</a>
                <a href="{% url 'expenses' %}" class="btn btn-secondary btn-lg">Go to Dashboard</a>
            </div>
            
            <p class="text-muted mt-4">
                If the problem persists, please <a href="mailto:support@expensetracker.com">contact support</a> with your user ID.
            </p>
        </div>
    </div>
</div>
{% endblock %}
